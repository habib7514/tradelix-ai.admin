<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Forex Admin - AI Analysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg-main: #0a0a0a; 
            --bg-card: #141414; 
            --gold: #F5C518; 
            --green: #00D084; 
            --red: #FF4757; 
            --text-main: #ffffff; 
            --text-muted: #999999; 
            --border: #1F1F1F; 
        }
        /* ✅ تم تكبير الخط الأساسي */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; font-size: 16px; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; padding-bottom: 30px; }
        
        /* ✅ تكبير شاشة تسجيل الدخول */
        #loginSection { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .login-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 40px 25px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
        .login-box h1 { color: var(--gold); margin-bottom: 25px; font-size: 28px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; color: var(--text-muted); margin-bottom: 10px; font-size: 16px; font-weight: 700; }
        .form-group input { width: 100%; padding: 18px; border-radius: 12px; border: 1px solid var(--border); background: #000; color: #fff; font-size: 18px; outline: none; }
        
        /* ✅ تكبير شاشة التطبيق */
        #appSection { display: none; max-width: 500px; margin: 0 auto; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: var(--bg-card); padding: 20px; border-radius: 20px; border: 1px solid var(--border); }
        .header h2 { color: var(--gold); font-size: 24px; }
        
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 25px; margin-bottom: 25px; }
        
        /* ✅ تكبير زر التحليل */
        .analyze-btn { width: 100%; padding: 20px; background: var(--gold); color: #000; border: none; border-radius: 15px; font-weight: 900; font-size: 20px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 20px; transition: 0.2s; }
        .analyze-btn:active { transform: scale(0.98); }
        
        /* ✅ تكبير القائمة المنسدلة */
        #assetSelect { width: 100%; padding: 18px; background: #000; border: 1px solid #333; color: #fff; border-radius: 15px; margin-bottom: 20px; outline: none; font-size: 18px; font-weight: 700; }
        
        /* ✅ تكبير نتيجة التحليل */
        #aiResultBox { display: none; border: 2px solid var(--gold); border-radius: 20px; padding: 25px; background: linear-gradient(145deg, #1A1500, #0a0a0a); text-align: center; margin-bottom: 25px; }
        .ai-direction { font-size: 55px; font-weight: 900; margin-bottom: 15px; }
        .ai-details { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #333; color: var(--text-muted); font-size: 18px; }
        .ai-details span:last-child { color: #fff; font-weight: 900; font-size: 20px; }
        
        /* ✅ تكبير الأزرار السفلية */
        .action-btn { width: 100%; padding: 20px; border: none; border-radius: 15px; font-weight: 900; font-size: 18px; cursor: pointer; margin-bottom: 15px; display: flex; justify-content: center; align-items: center; gap: 10px; transition: 0.2s; }
        .action-btn:active { transform: scale(0.98); }
        .btn-green { background: var(--green); color: #000; }
        .btn-outline { background: transparent; border: 2px solid var(--border); color: #fff; }
        .btn-red { background: rgba(255,71,87,0.1); border: 2px solid var(--red); color: var(--red); margin-top: 25px; }
    </style>
</head>
<body>

    <!-- قسم تسجيل الدخول -->
    <div id="loginSection">
        <div class="login-box">
            <h1>🔒 Forex Admin</h1>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="adminEmail" value="mmatrix08@gmail.com" readonly>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="adminPassword" placeholder="••••••••">
            </div>
            <button class="analyze-btn" onclick="adminLogin()">Login</button>
            <p id="loginError" style="color: var(--red); font-size: 16px; margin-top: 15px;"></p>
        </div>
    </div>

    <!-- قسم لوحة التحكم -->
    <div id="appSection">
        <div class="header">
            <h2>💱 AI Analysis</h2>
            <button onclick="logout()" style="background:transparent; border:none; color:var(--red); font-weight:900; font-size: 18px; cursor:pointer;">Logout</button>
        </div>

        <div class="card">
            <label style="color: var(--text-muted); font-size: 16px; font-weight: 700; margin-bottom: 15px; display: block;">Select Asset to Analyze</label>
            <select id="assetSelect">
                <!-- سيتم تعبئتها عبر JS -->
            </select>
            
            <button class="analyze-btn" onclick="runAIAnalysis()" id="analyzeBtn">
                🤖 Analyze Market Now
            </button>
        </div>

        <!-- بطاقة النتيجة (مخفية حتى يتم التحليل) -->
        <div id="aiResultBox">
            <div style="color: var(--text-muted); font-size: 16px; margin-bottom: 10px;" id="resultAssetName">EUR/USD</div>
            <div class="ai-direction" id="resultDirection">BUY</div>
            
            <div class="ai-details">
                <span>Entry</span>
                <span id="resultEntry" style="color: var(--gold);">-</span>
            </div>
            <div class="ai-details">
                <span>Stop Loss</span>
                <span id="resultSL" style="color: var(--red);">-</span>
            </div>
            <div class="ai-details" style="border-bottom: none;">
                <span>Take Profit</span>
                <span id="resultTP" style="color: var(--green);">-</span>
            </div>

            <button class="action-btn btn-green" onclick="sendToSubscribers()" id="sendBtn" style="margin-top: 25px;">
                🚀 Send to Subscribers
            </button>
            <button class="action-btn btn-outline" onclick="editSignal()">
                📝 Edit Before Sending
            </button>
        </div>

        <!-- زر مسح الصفقات القديمة -->
        <button class="action-btn btn-red" onclick="clearOldSignals(event)">
            🗑️ Clear Old Signals
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAPHGtTeDNamwyR2kfg-b9ABp7pNyyiPKM",
            authDomain: "tradelix-ai.firebaseapp.com",
            projectId: "tradelix-ai",
            storageBucket: "tradelix-ai.firebasestorage.app",
            messagingSenderId: "374195897663",
            appId: "1:374195897663:web:e1ed0ce2c30a4b6aeabf8a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ==========================================
        // 🔐 نظام تسجيل الدخول المبسط
        // ==========================================
        const ADMIN_EMAIL = "mmatrix08@gmail.com";
        const ADMIN_PASSWORD = "123456"; 

        window.adminLogin = function() {
            const email = document.getElementById('adminEmail').value;
            const pass = document.getElementById('adminPassword').value;
            const errEl = document.getElementById('loginError');

            if (email === ADMIN_EMAIL && pass === ADMIN_PASSWORD) {
                errEl.textContent = "";
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('appSection').style.display = 'block';
                document.getElementById('adminPassword').value = ''; 
                loadForexPairs(); // تحميل الأزواج عند الدخول
            } else {
                errEl.textContent = "Login failed: Incorrect password.";
            }
        };

        window.logout = function() {
            document.getElementById('appSection').style.display = 'none';
            document.getElementById('loginSection').style.display = 'flex';
        };

        // ==========================================
        // 💱 قائمة أزواج العملات
        // ==========================================
        const forexPairs = [
            "EUR/USD", "GBP/USD", "USD/JPY", "AUD/USD", "USD/CAD", "NZD/USD", "USD/CHF", 
            "EUR/GBP", "EUR/JPY", "GBP/JPY", "AUD/JPY", "CHF/JPY", "EUR/AUD", "EUR/CAD", 
            "GBP/AUD", "GBP/CAD", "AUD/CAD", "AUD/NZD", "XAU/USD", "XAG/USD"
        ];

        function loadForexPairs() {
            const select = document.getElementById('assetSelect');
            select.innerHTML = '';
            forexPairs.forEach(item => {
                select.innerHTML += `<option value="${item}">${item}</option>`;
            });
        }

        // ==========================================
        // 🤖 توليد التحليل
        // ==========================================
        window.runAIAnalysis = function() {
            const btn = document.getElementById('analyzeBtn');
            const asset = document.getElementById('assetSelect').value;
            
            btn.innerHTML = '⏳ Analyzing Data...';
            btn.disabled = true;

            setTimeout(() => {
                const isBuy = Math.random() > 0.5;
                const direction = isBuy ? 'BUY' : 'SELL';
                
                let entry, sl, tp;
                const base = asset.includes('JPY') ? 150.500 : (asset.includes('XAU') || asset.includes('XAG') ? 3870.50 : 1.08500);
                entry = base;
                sl = isBuy ? base - 0.0050 : base + 0.0050;
                tp = isBuy ? base + 0.0100 : base - 0.0100;

                document.getElementById('resultAssetName').textContent = asset;
                const dirEl = document.getElementById('resultDirection');
                dirEl.textContent = direction;
                dirEl.style.color = direction === 'BUY' ? 'var(--green)' : 'var(--red)';
                
                const decimal = asset.includes('JPY') ? 3 : (asset.includes('XAU') || asset.includes('XAG') ? 2 : 5);
                
                document.getElementById('resultEntry').textContent = entry.toFixed(decimal);
                document.getElementById('resultSL').textContent = sl.toFixed(decimal);
                document.getElementById('resultTP').textContent = tp.toFixed(decimal);

                document.getElementById('aiResultBox').style.display = 'block';
                
                btn.innerHTML = '🤖 Analyze Market Now';
                btn.disabled = false;
            }, 1500);
        };

        window.editSignal = function() {
            let entry = prompt("Edit Entry:", document.getElementById('resultEntry').textContent);
            if (entry) document.getElementById('resultEntry').textContent = entry;

            let sl = prompt("Edit Stop Loss:", document.getElementById('resultSL').textContent);
            if (sl) document.getElementById('resultSL').textContent = sl;

            let tp = prompt("Edit Take Profit:", document.getElementById('resultTP').textContent);
            if (tp) document.getElementById('resultTP').textContent = tp;
        };

        // ==========================================
        // 🚀 إرسال الإشارة
        // ==========================================
        window.sendToSubscribers = async function() {
            const btn = document.getElementById('sendBtn');
            const pair = document.getElementById('resultAssetName').textContent;
            const direction = document.getElementById('resultDirection').textContent;
            const entry = document.getElementById('resultEntry').textContent;
            const sl = document.getElementById('resultSL').textContent;
            const tp = document.getElementById('resultTP').textContent;

            if (entry === '-') return;

            btn.innerHTML = '⏳ Sending...';
            btn.disabled = true;

            try {
                await addDoc(collection(db, 'forex_signals'), {
                    pair: pair,
                    direction: direction,
                    entry: entry,
                    stopLoss: sl,
                    takeProfit: tp,
                    createdAt: serverTimestamp()
                });

                alert(`✅ Forex Signal for ${pair} sent successfully to users!`);
                document.getElementById('aiResultBox').style.display = 'none';

            } catch (error) {
                alert("❌ Error: " + error.message);
            } finally {
                btn.innerHTML = '🚀 Send to Subscribers';
                btn.disabled = false;
            }
        };

        // ==========================================
        // 🗑️ مسح الصفقات القديمة
        // ==========================================
        window.clearOldSignals = async function(event) {
            const confirmDelete = confirm("⚠️ Are you sure you want to delete ALL Forex signals? This action cannot be undone.");
            if (!confirmDelete) return;

            const btn = event.target;
            const originalText = btn.innerHTML;
            btn.innerHTML = '⏳ Clearing...';
            btn.disabled = true;

            try {
                const colRef = collection(db, 'forex_signals');
                const snapshot = await getDocs(colRef);
                
                if(snapshot.empty) {
                    alert("No signals to clear!");
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                    return;
                }

                const batch = writeBatch(db);
                snapshot.forEach((doc) => {
                    batch.delete(doc.ref);
                });
                
                await batch.commit();
                alert("✅ All Forex signals have been cleared successfully!");
                document.getElementById('aiResultBox').style.display = 'none';

            } catch (error) {
                console.error("Error clearing signals: ", error);
                alert("❌ Error: " + error.message);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
