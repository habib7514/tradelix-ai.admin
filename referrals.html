<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRADIX AI - Referrals Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAPHGtTeDNamwyR2kfg-b9ABp7pNyyiPKM",
            authDomain: "tradelix-ai.firebaseapp.com",
            projectId: "tradelix-ai",
            storageBucket: "tradelix-ai.firebasestorage.app",
            messagingSenderId: "374195897663",
            appId: "1:374195897663:web:e1ed0ce2c30a4b6aeabf8a"
        };

        const app = initializeApp(firebaseConfig);
        window.firebaseAuth = getAuth(app);
        window.firebaseDB = getFirestore(app);
        window.firebaseReady = true;

        // التحقق من تسجيل دخول الأدمن
        onAuthStateChanged(window.firebaseAuth, (user) => {
            if (!user) {
                // إذا لم يكن مسجلاً، يتم توجيهه لصفحة تسجيل الدخول (افترض أن اسمها index.html)
                window.location.href = 'index.html';
            }
        });
    </script>
    
    <style>
        :root { --bg-color: #0a0a0a; --card-bg: #141414; --card-border: #2a2a2a; --gold: #d4af37; --gold-light: #f4d03f; --text-main: #ffffff; --text-muted: #888888; --green: #22c55e; --red: #ef4444; --orange: #f59e0b; --btn-gold-bg: linear-gradient(135deg, #d4af37, #f4d03f); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 20px; padding-top: 20px; background: var(--bg-color); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #222; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .header-logo { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #d4af37, #f4d03f); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; color: #000; box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }
        .header-title h1 { font-size: 16px; font-weight: 900; color: var(--gold); letter-spacing: 1px; }
        .header-title span { font-size: 9px; color: var(--red); font-weight: 700; letter-spacing: 2px; }
        .back-btn { background: var(--card-bg); border: 1px solid #333; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--gold); cursor: pointer; text-decoration: none; }
        
        .container { padding: 0 20px 40px 20px; max-width: 480px; margin: 0 auto; }
        
        .filters { display: flex; gap: 8px; margin-bottom: 20px; }
        .filter-btn { flex: 1; padding: 10px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; border: 1px solid #333; background: var(--card-bg); color: var(--text-muted); transition: 0.3s; font-family: inherit; }
        .filter-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(212, 175, 55, 0.1); }

        .user-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .user-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .user-name { font-size: 15px; font-weight: 700; color: var(--gold-light); }
        .user-email { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
        .user-status { font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 10px; }
        .user-status.inactive { background: rgba(239, 68, 68, 0.15); color: var(--red); border: 1px solid var(--red); }
        .user-status.active { background: rgba(34, 197, 94, 0.15); color: var(--green); border: 1px solid var(--green); }
        .user-status.pending { background: rgba(245, 158, 11, 0.15); color: var(--orange); border: 1px solid var(--orange); }

        .btn-block { width: 100%; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; border: none; background: var(--btn-gold-bg); color: #000; transition: 0.3s; font-family: 'Tajawal', sans-serif; }
        .btn-block.success { background: var(--green); color: #fff; }
        .btn-block.outline { background: transparent; border: 1px solid #444; color: #fff; }

        /* Modal */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 99998; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: #141414; border: 1px solid var(--gold); border-radius: 16px; padding: 24px; width: 100%; max-width: 400px; }
        .detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #222; font-size: 13px; }
        .detail-row span:first-child { color: var(--text-muted); }
        .detail-row span:last-child { color: var(--gold-light); font-weight: 700; }
        
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
        
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--gold); color: #000; padding: 12px 24px; border-radius: 12px; font-weight: 700; font-size: 14px; opacity: 0; transition: 0.3s; z-index: 99999; text-align: center; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <div class="header-logo">A</div>
            <div class="header-title"><h1>REFERRALS</h1><span>● MANAGEMENT</span></div>
        </div>
        <a href="index.html" class="back-btn">✕</a>
    </div>

    <div class="container">
        <div class="filters">
            <button class="filter-btn active" id="btnAll" onclick="filterData('all')">All</button>
            <button class="filter-btn" id="btnPending" onclick="filterData('pending')">Ready for Reward</button>
            <button class="filter-btn" id="btnRewarded" onclick="filterData('rewarded')">Rewarded</button>
        </div>

        <div id="referralsList">
            <div class="empty-state">
                <div class="icon">⏳</div>
                <h3>Loading referrals...</h3>
            </div>
        </div>
    </div>

    <!-- Reward Modal -->
    <div id="rewardModal" class="modal">
        <div class="modal-content">
            <h3 style="color: var(--gold); margin-bottom: 20px; text-align: center; font-size: 18px;">🎁 Give Referral Reward</h3>
            
            <div class="detail-row"><span>Referrer Name</span><span id="rewardReferrerName">-</span></div>
            <div class="detail-row"><span>Current Crypto Expiry</span><span id="rewardCurrentExpiry">-</span></div>
            <div class="detail-row"><span>Days Left</span><span id="rewardDaysLeft">-</span></div>
            
            <div style="background: rgba(34, 197, 94, 0.1); border: 1px dashed var(--green); border-radius: 8px; padding: 12px; margin: 15px 0; text-align: center;">
                <span style="color: var(--green); font-weight: 900; font-size: 14px;">New Expiry: <br><span id="rewardNewExpiry" style="font-size: 18px; margin-top: 5px; display: inline-block;">-</span></span>
            </div>

            <button class="btn-block success" onclick="confirmReward()" style="margin-bottom: 8px;">✅ Confirm & Add 7 Days</button>
            <button class="btn-block outline" onclick="closeRewardModal()">Cancel</button>
        </div>
    </div>

    <div id="toast" class="toast">Message</div>

    <script>
        let db, allUsers = [], currentFilter = 'all', currentRewardData = null;
        let collection, getDocs, doc, getDoc, updateDoc;

        function showToast(msg) { 
            const t = document.getElementById('toast'); 
            t.textContent = msg; 
            t.classList.add('show'); 
            setTimeout(() => t.classList.remove('show'), 2500); 
        }

        async function init() {
            if (!window.firebaseReady) { setTimeout(init, 500); return; }
            
            const fsModule = await import("https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js");
            db = window.firebaseDB;
            collection = fsModule.collection; getDocs = fsModule.getDocs; doc = fsModule.doc; getDoc = fsModule.getDoc; updateDoc = fsModule.updateDoc;

            await loadData();
        }

        async function loadData() {
            try {
                const snap = await getDocs(collection(db, 'tradelix_users'));
                allUsers = [];
                snap.forEach(d => allUsers.push({ uid: d.id, ...d.data() }));
                renderReferrals();
            } catch (e) {
                console.error(e);
                document.getElementById('referralsList').innerHTML = '<div class="empty-state"><h3 style="color:var(--red);">Error loading data</h3></div>';
            }
        }

        function filterData(type) {
            currentFilter = type;
            document.getElementById('btnAll').className = type === 'all' ? 'filter-btn active' : 'filter-btn';
            document.getElementById('btnPending').className = type === 'pending' ? 'filter-btn active' : 'filter-btn';
            document.getElementById('btnRewarded').className = type === 'rewarded' ? 'filter-btn active' : 'filter-btn';
            renderReferrals();
        }

        function renderReferrals() {
            const list = document.getElementById('referralsList');
            let referredUsers = allUsers.filter(u => u.referred_by);

            if (currentFilter === 'pending') {
                referredUsers = referredUsers.filter(u => u.status === 'active' && !u.referral_rewarded);
            } else if (currentFilter === 'rewarded') {
                referredUsers = referredUsers.filter(u => u.referral_rewarded === true);
            }

            if (referredUsers.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="icon">📭</div><h3>No Referrals Found</h3><p>Try changing the filter.</p></div>';
                return;
            }

            list.innerHTML = referredUsers.map(referred => {
                const referrer = allUsers.find(u => u.uid === referred.referred_by);
                const referrerName = referrer ? (referrer.name || referrer.email) : 'Unknown User';
                
                let statusBadge = '';
                let actionBtn = '';
                
                if (referred.referral_rewarded) {
                    statusBadge = '<span class="user-status active">Rewarded</span>';
                } else if (referred.status === 'active') {
                    statusBadge = '<span class="user-status pending">Ready</span>';
                    actionBtn = `<button class="btn-block" style="margin-top:12px; padding:10px; font-size:13px;" onclick="openRewardModal('${referred.referred_by}', '${referrerName}', '${referred.uid}')">🎁 Give Reward</button>`;
                } else {
                    statusBadge = '<span class="user-status inactive">Inactive</span>';
                }

                return `
                    <div class="user-card">
                        <div class="user-header">
                            <div>
                                <div class="user-name">Dari: ${referrerName}</div>
                                <div class="user-email">Diundang: ${referred.name || referred.email}</div>
                            </div>
                            <div>${statusBadge}</div>
                        </div>
                        ${actionBtn}
                    </div>
                `;
            }).join('');
        }

        function openRewardModal(referrerUid, referrerName, referredUid) {
            const referrer = allUsers.find(u => u.uid === referrerUid);
            if (!referrer) return showToast('Referrer not found');

            currentRewardData = { referrerUid, referredUid };
            
            document.getElementById('rewardReferrerName').textContent = referrerName;
            
            let currentExpiry = referrer.cryptoExpiry ? new Date(referrer.cryptoExpiry) : null;
            let displayExpiry = currentExpiry ? currentExpiry.toISOString().split('T')[0] : 'None';
            document.getElementById('rewardCurrentExpiry').textContent = displayExpiry;
            
            const today = new Date();
            today.setHours(0,0,0,0);
            let daysLeft = 0;
            
            // حساب الأيام المتبقية
            if (currentExpiry && currentExpiry > today) {
                daysLeft = Math.ceil((currentExpiry - today) / (1000 * 60 * 60 * 24));
            }
            document.getElementById('rewardDaysLeft').textContent = daysLeft + ' days';

            // حساب التاريخ الجديد (إذا كان نشطاً نضيف على تاريخه، وإذا كان منتهياً نضيف على تاريخ اليوم)
            let baseDate = today;
            if (currentExpiry && currentExpiry > today) {
                baseDate = currentExpiry;
            }
            const newExpiry = new Date(baseDate);
            newExpiry.setDate(newExpiry.getDate() + 7); // إضافة 7 أيام
            const newExpiryStr = newExpiry.toISOString().split('T')[0];
            
            document.getElementById('rewardNewExpiry').textContent = newExpiryStr + ' (Total ' + (daysLeft + 7) + ' days)';
            currentRewardData.newExpiryStr = newExpiryStr;
            
            document.getElementById('rewardModal').style.display = 'flex';
        }

        function closeRewardModal() {
            document.getElementById('rewardModal').style.display = 'none';
            currentRewardData = null;
        }

        async function confirmReward() {
            if (!currentRewardData) return;
            const { referrerUid, referredUid, newExpiryStr } = currentRewardData;
            
            try {
                const referrerRef = doc(db, 'tradelix_users', referrerUid);
                const referrerSnap = await getDoc(referrerRef);
                
                if (referrerSnap.exists()) {
                    const refData = referrerSnap.data();
                    let newPlanType = refData.planType || 'crypto';
                    
                    if (newPlanType === 'gold') {
                        newPlanType = 'both';
                    } else if (newPlanType === 'course' || newPlanType === 'none') {
                        newPlanType = 'crypto';
                    }
                    
                    await updateDoc(referrerRef, {
                        cryptoExpiry: newExpiryStr,
                        planType: newPlanType,
                        status: 'active'
                    });
                }
                
                // تحديث حالة الإحالة إلى "تم إعطاء الهدية"
                await updateDoc(doc(db, 'tradelix_users', referredUid), {
                    referral_rewarded: true
                });
                
                showToast('✅ Reward given successfully!');
                closeRewardModal();
                await loadData(); // تحديث القائمة
            } catch (e) {
                console.error(e);
                showToast('❌ Error giving reward');
            }
        }

        window.addEventListener('load', init);
    </script>
</body>
</html>
